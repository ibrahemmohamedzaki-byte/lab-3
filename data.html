<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="validation.html">Registration</a>
        <a href="data.html">Data Table</a>
    </nav>

    <h1>People Table</h1>

    <div class="controls">
        <label for="search" class="sr-only">Search</label>
        <input type="search" id="search" placeholder="Search by name, age or city...">
        <button type="button" id="sortName">Sort by Name</button>
        <button type="button" id="sortAge">Sort by Age</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    <p id="noResults" hidden>No results found.</p>

    <script src="data.js"></script>
</body>
</html>
